name: Build Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: humanizer/pyproject.toml

      - name: Install dependencies
        shell: cmd
        run: |
          pip install -e "humanizer[dev]"
          pip install "pyinstaller>=6.0"

      - name: Run tests before packaging
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pytest humanizer/tests/ -v --tb=short

      - name: Build executables
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m PyInstaller --noconfirm build.spec

      - name: Create ZIP package
        shell: cmd
        run: |
          powershell Compress-Archive -Path dist\* -DestinationPath Humanizer_Portable_v${{ github.ref_name }}.zip

      - name: Upload artifacts (CI page)
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-win-py${{ matrix.python-version }}-${{ github.ref_name }}
          path: |
            dist/
            Humanizer_Portable_v*.zip
          retention-days: 30

      - name: Upload Release assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/humanizer.exe
            dist/humanizer-web.exe
            Humanizer_Portable_v${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
