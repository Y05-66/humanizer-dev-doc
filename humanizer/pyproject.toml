[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer"
version = "0.1.0"
description = "「去AI味」中文文本改写程序"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "regex>=2023.0",
    "openai>=1.0,<2.0",
    "rich>=13.0",
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
]
local-model = [
    "transformers>=4.30",
    "torch>=2.0",
]

[project.scripts]
humanizer = "humanizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
